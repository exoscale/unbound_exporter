name: test

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

env:
  GO111MODULE: "auto"

jobs:
  test:
    strategy:
      matrix:
        go-version: [1.20.x]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Checkout code
        uses: actions/checkout@v7.0.1
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
      - name: go coverage
        run: |
          go test -mod=readonly -v -race -covermode=atomic -coverprofile=coverage.out ./...
